<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f1222" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%234f46e5'/%3E%3Cstop offset='.55' stop-color='%237c3aed'/%3E%3Cstop offset='1' stop-color='%2306b6d4'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='8' fill='url(%23g)'/%3E%3Cpath d='M6 13l10-6 10 6v12H6z' fill='none' stroke='white' stroke-width='2' stroke-linejoin='round'/%3E%3Crect x='10' y='16' width='5' height='5' rx='1' fill='white'/%3E%3Crect x='17' y='16' width='5' height='5' rx='1' fill='white' opacity='.7'/%3E%3C/svg%3E" />
    <title>WMS</title>
    <script>
      // Apply the saved color mode before React mounts so the page does not flash light-then-dark
      try {
        var ui = JSON.parse(localStorage.getItem("wms-ui") || "{}").state || {};
        var mode = ui.mode || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        document.documentElement.dataset.theme = mode;
        document.documentElement.style.colorScheme = mode;
        document.documentElement.style.background = mode === "dark" ? "#0b0d17" : "#f4f6fb";
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
