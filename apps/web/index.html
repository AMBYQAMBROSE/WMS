<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f8fa" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0e0f12" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234f46e5'/%3E%3Cpath d='M7 13.5 16 8l9 5.5V24H7z' fill='none' stroke='white' stroke-width='2' stroke-linejoin='round'/%3E%3Crect x='11' y='16' width='4' height='4' rx='.8' fill='white'/%3E%3Crect x='17' y='16' width='4' height='4' rx='.8' fill='white' opacity='.7'/%3E%3C/svg%3E" />
    <title>WMS</title>
    <script>
      // Apply the saved color mode before React mounts so the page does not flash light-then-dark
      try {
        var ui = JSON.parse(localStorage.getItem("wms-ui") || "{}").state || {};
        var pref = ui.preference || ui.mode || "system";
        var mode = pref === "system" ? (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light") : pref;
        document.documentElement.dataset.theme = mode;
        document.documentElement.style.colorScheme = mode;
        document.documentElement.style.background = mode === "dark" ? "#0e0f12" : "#f7f8fa";
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
