# Production deployment: all settings live in .env in this directory (generated by the install script); never hard-code passwords here.
# Images are imported from the offline package with docker load, never pulled; the version comes from WMS_VERSION in .env, and upgrade/rollback only change that value.

x-logging: &logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  # Bundled SQL Server (enabled when COMPOSE_PROFILES=bundled-db); not started when the customer uses their own SQL Server.
  # No ports are exposed, only the backend container connects; add ports temporarily when you need SSMS for troubleshooting.
  db:
    image: ${MSSQL_IMAGE:-mcr.microsoft.com/mssql/server:2022-latest}
    profiles: ["bundled-db"]
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-}
      # License: Express is free (10GB per database); with a customer license change to Standard/Enterprise or a product key
      MSSQL_PID: ${MSSQL_PID:-Express}
      MSSQL_COLLATION: Chinese_PRC_CI_AS
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - mssql_data:/var/opt/mssql
      - ./backups:/var/opt/mssql/backup
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped
    logging: *logging

  backend:
    image: wms-backend:${WMS_VERSION:?set WMS_VERSION in .env}
    env_file: .env
    environment:
      APP_ENV: production
    depends_on:
      db:
        condition: service_healthy
        required: false
    restart: unless-stopped
    logging: *logging

  # Integration push process: sends document events to external systems (ERP etc.); same image as the backend
  worker:
    image: wms-backend:${WMS_VERSION:?set WMS_VERSION in .env}
    command: ["python", "-m", "app.worker"]
    env_file: .env
    environment:
      APP_ENV: production
    depends_on:
      backend:
        condition: service_healthy
    # The image's built-in health check probes the backend HTTP port; the worker has no HTTP, so check its heartbeat instead
    healthcheck:
      test: ["CMD", "python", "-m", "app.worker", "--check"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    stop_grace_period: 30s
    restart: unless-stopped
    logging: *logging

  web:
    image: wms-web:${WMS_VERSION:?set WMS_VERSION in .env}
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    logging: *logging

volumes:
  mssql_data:
