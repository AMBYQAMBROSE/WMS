# Local development only: runs a SQL Server container. For production/customer deployment see deploy/ and docs/deployment.md.
services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "YourPassword123!"
      MSSQL_COLLATION: Chinese_PRC_CI_AS
    ports:
      - "1433:1433"
    volumes:
      - db_data:/var/opt/mssql

volumes:
  db_data:
